<h2>New task</h2>

<form class="form" [formGroup]="form" (ngSubmit)="save()">
  <label>
    Title
    <input formControlName="title" />
    @if (form.controls.title.touched && form.controls.title.invalid) {
      <span class="error">Between 3 and 50 characters.</span>
    }
  </label>

  <label>
    Description
    <textarea formControlName="description" rows="3"></textarea>
    @if (form.controls.description.invalid) {
      <span class="error">Maximum 150 characters.</span>
    }
  </label>

  <label>
    User
    <select formControlName="userId">
      <option [ngValue]="0" disabled>Select a user</option>
      @for (user of users(); track user.id) {
        <option [ngValue]="user.id">{{ user.name }}</option>
      }
    </select>
    @if (form.controls.userId.touched && form.controls.userId.invalid) {
      <span class="error">Select a user.</span>
    }
  </label>

  <fieldset>
    <legend>Additional info (optional)</legend>

    <div class="form">
      <label>
        Priority
        <select formControlName="priority">
          <option value="">No priority</option>
          @for (priority of priorities; track priority) {
            <option [value]="priority">{{ priority }}</option>
          }
        </select>
      </label>

      <label>
        Estimated end date
        <input type="date" formControlName="estimatedEndDate" />
      </label>

      <label>
        Tags
        <input formControlName="tags" placeholder="frontend, auth, ui" />
        <span class="hint">Comma-separated.</span>
      </label>
    </div>
  </fieldset>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <div>
    <button type="submit">Create task</button>
    <a routerLink="/tasks">Cancel</a>
  </div>
</form>
